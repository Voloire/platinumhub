; ===========================================================================
;  Platinum Hub — configurazione di pytest
; ---------------------------------------------------------------------------
;  Convenzione del progetto (vale per chiunque scriva test):
;
;    comando        python -m pytest              (dalla radice del repository)
;    cartella       tests/
;    file           tests/test_*.py
;    classi         Test* oppure unittest.TestCase
;    funzioni       test_*
;
;  La suite e' scritta in unittest puro, quindi gira anche con
;  `python tests/run_all.py` senza installare nulla: la CI esegue entrambi,
;  perche' il secondo e' la prova che i test non hanno preso dipendenze.
;
;  I test che richiedono un browser stanno in tests/optional_playwright_ui.py,
;  che di proposito NON si chiama test_*.py e non viene raccolto: si lancia
;  a mano con `python tests/optional_playwright_ui.py`. Vedi docs/CI.md.
; ===========================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --durations=10

; Nessun test deve poter bloccare la CI in eterno: l'app apre socket e
; sottoprocessi, un test appeso costerebbe 6 ore di runner.
timeout = 180
timeout_method = thread

; Marcatori registrati e disponibili. La suite attuale non li usa ancora:
; servono a chi vorrà selezionare sottoinsiemi (`pytest -m data`).
markers =
    data: integrità dei dati delle route (data/*.json). Nessuna rete, nessun sottoprocesso. È il gruppo che protegge la stringa posizionale dei progressi.
    smoke: avvia app.py in un sottoprocesso e interroga gli endpoint HTTP.
    e2e: end-to-end con Playwright (richiede `python -m playwright install chromium`).
    windows: test che hanno senso solo su Windows (hotkey globali, exe).

filterwarnings =
    error::DeprecationWarning:tests.*
    default
